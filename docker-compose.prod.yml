# Production Docker Compose for Documentation Platform
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal-backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DEBUG=false
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required for production}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required for production}
      - ANALYTICS_DATABASE_URL=${ANALYTICS_DATABASE_URL:-sqlite:///./data/analytics.db}
      - CHAT_DATABASE_URL=${CHAT_DATABASE_URL:-sqlite:///./data/chat.db}
      - CORS_ORIGINS=["https://portal.example.com"]
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_REQUESTS=100
      - RATE_LIMIT_WINDOW=60
      # Email (optional)
      - EMAIL_ENABLED=${EMAIL_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@portal.com}
      # S3 Storage (optional)
      - S3_ENABLED=${S3_ENABLED:-false}
      - S3_BUCKET=${S3_BUCKET:-document-portal}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      # AI Assistant (optional)
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - ASSISTANT_MODEL=${ASSISTANT_MODEL:-llama3.1:8b}
      - ASSISTANT_MAX_TOKENS=${ASSISTANT_MAX_TOKENS:-2048}
      - ASSISTANT_TEMPERATURE=${ASSISTANT_TEMPERATURE:-0.7}
      - ASSISTANT_ENABLED=${ASSISTANT_ENABLED:-false}
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - portal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://api.portal.example.com
        - VITE_COLLAB_SERVER_URL=wss://collab.portal.example.com
    container_name: portal-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount SSL certificates if using HTTPS
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - portal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Real-time Collaboration Server (Hocuspocus)
  collab-server:
    build:
      context: ./collab-server
      dockerfile: Dockerfile
    container_name: portal-collab-server
    restart: unless-stopped
    environment:
      - PORT=8002
      - HOST=0.0.0.0
      - JWT_SECRET=${SECRET_KEY:?SECRET_KEY is required for production}
      - BACKEND_URL=http://backend:8000
      - LOG_LEVEL=info
      # Redis for horizontal scaling (optional)
      - REDIS_URL=${REDIS_URL:-}
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - portal-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for collaboration scaling (optional)
  redis:
    image: redis:7-alpine
    container_name: portal-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - portal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    profiles:
      - with-redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Self-hosted LLM inference (AI Assistant)
  ollama:
    image: ollama/ollama:latest
    container_name: portal-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - portal-network
    deploy:
      resources:
        reservations:
          memory: 4G
    profiles:
      - with-ollama
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL — production database
  # Set DATABASE_URL=postgresql://portal:${POSTGRES_PASSWORD}@postgres:5432/portal
  postgres:
    image: postgres:16-alpine
    container_name: portal-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=portal
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-portal}
      - POSTGRES_DB=portal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - portal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - with-postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend-data:
    name: portal-backend-data
  backend-uploads:
    name: portal-backend-uploads
  redis-data:
    name: portal-redis-data
  ollama-data:
    name: portal-ollama-data
  postgres-data:
    name: portal-postgres-data

networks:
  portal-network:
    name: portal-network
    driver: bridge
