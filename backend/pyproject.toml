[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "audience_smoke.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-n", "8",
    "--strict-markers",
    "--tb=short",
    "-p", "no:asyncio",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "smoke: Critical-path smoke tests",
]
filterwarnings = [
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
    "ignore:on_event is deprecated:DeprecationWarning",
    "ignore:'asyncio.iscoroutinefunction':DeprecationWarning:chromadb",
    "ignore:No path_separator found:DeprecationWarning:alembic",
    "ignore:Coercing Subquery object:sqlalchemy.exc.SAWarning",
    "ignore::ResourceWarning",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
