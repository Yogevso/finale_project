name: E2E - Nightly Regression

on:
  schedule:
    # Daily at 01:30 UTC
    - cron: '30 1 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  e2e-regression:
    name: Full E2E Regression Suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (for backend)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create backend directories
        working-directory: ./backend
        run: mkdir -p data uploads

      - name: Seed backend data for E2E
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: python seed_data.py

      - name: Rebuild search index
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          python -c "
          from app.db import SessionLocal
          from app.services.search_index_service import SearchIndexSyncService
          db = SessionLocal()
          SearchIndexSyncService(db).rebuild_index()
          db.commit()
          db.close()
          "

      - name: Start backend server
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          RATE_LIMIT_ENABLED: "false"
          CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173"]'
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done || exit 1

      - name: Start frontend dev server
        run: |
          npm run dev &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break || sleep 2; done || exit 1

      - name: Run full E2E regression suite
        env:
          PW_SKIP_WEBSERVER: '1'
          BASE_URL: 'http://localhost:3000'
        run: npx playwright test --reporter=github

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report
          path: frontend/playwright-report
          retention-days: 14
