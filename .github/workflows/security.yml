# Security Scanning Workflow
# Runs security scans on dependencies, Docker images, and code

name: Security - Vulnerability Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================
  # Dependency Vulnerability Scanning
  # ============================================
  dependency-scan-backend:
    name: Backend Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install safety pip-audit

      - name: Run Safety check
        working-directory: ./backend
        continue-on-error: true
        run: safety check -r requirements.txt --json --output safety-report.json

      - name: Run pip-audit (runtime)
        working-directory: ./backend
        continue-on-error: true
        run: |
          IGNORE_ARGS=$(grep -vE '^\s*(#|$)' pip-audit.ignore | sed 's/.*/--ignore-vuln &/' | xargs)
          pip-audit -r requirements.txt --format json --output pip-audit-runtime-report.json ${IGNORE_ARGS}

      - name: Run pip-audit (dev)
        working-directory: ./backend
        continue-on-error: true
        run: |
          IGNORE_ARGS=$(grep -vE '^\s*(#|$)' pip-audit.ignore | sed 's/.*/--ignore-vuln &/' | xargs)
          pip-audit -r requirements-dev.txt --format json --output pip-audit-dev-report.json ${IGNORE_ARGS}

      - name: Upload security reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-security-reports
          path: |
            backend/safety-report.json
            backend/pip-audit-runtime-report.json
            backend/pip-audit-dev-report.json
          retention-days: 30

  dependency-scan-frontend:
    name: Frontend Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run npm audit
        working-directory: ./frontend
        shell: bash
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-report.json
          status=$?
          if [ ! -s npm-audit-report.json ]; then
            echo "{}" > npm-audit-report.json
          fi
          exit $status

      - name: Upload security report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-security-reports
          path: frontend/npm-audit-report.json
          retention-days: 30

  dependency-scan-collab:
    name: Collaboration Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: collab-server/package-lock.json

      - name: Install dependencies
        working-directory: ./collab-server
        run: npm ci

      - name: Run npm audit
        working-directory: ./collab-server
        shell: bash
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-report.json
          status=$?
          if [ ! -s npm-audit-report.json ]; then
            echo "{}" > npm-audit-report.json
          fi
          exit $status

      - name: Upload security report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collab-security-reports
          path: collab-server/npm-audit-report.json
          retention-days: 30

  # ============================================
  # CodeQL Analysis (SAST)
  # Note: Requires "Code scanning" to be enabled in repo Settings > Security
  # If not enabled, results won't upload but scan still runs
  # ============================================
  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    continue-on-error: true  # Continue if code scanning is not enabled in repo settings

    strategy:
      fail-fast: false
      matrix:
        language: ['python', 'javascript-typescript']

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@480db559a14342288b67e54bd959dd52dc3ee68f # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@480db559a14342288b67e54bd959dd52dc3ee68f # v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@480db559a14342288b67e54bd959dd52dc3ee68f # v3
        with:
          category: "/language:${{ matrix.language }}"

  # ============================================
  # Docker Image Security Scanning
  # ============================================
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            path: ./backend
            dockerfile: Dockerfile
          - name: frontend
            path: ./frontend
            dockerfile: Dockerfile
          - name: collab-server
            path: ./collab-server
            dockerfile: Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ${{ matrix.image.path }}
          file: ${{ matrix.image.path }}/${{ matrix.image.dockerfile }}
          push: false
          load: true
          tags: scan-${{ matrix.image.name }}:latest

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: scan-${{ matrix.image.name }}:latest
          format: 'sarif'
          output: 'trivy-${{ matrix.image.name }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: ${{ github.event_name == 'pull_request' && '0' || '1' }}  # Report on PRs, enforce on protected branches

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@480db559a14342288b67e54bd959dd52dc3ee68f # v3
        if: always()
        continue-on-error: true  # Continue if code scanning not enabled
        with:
          sarif_file: 'trivy-${{ matrix.image.name }}.sarif'

      - name: Run Trivy (table output for PR visibility)
        if: failure()  # Only show table if scan failed
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: scan-${{ matrix.image.name }}:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ============================================
  # Secret Scanning
  # ============================================
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@586f66d7886cd0b037c7c245d4a6e34ef357ab10
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          extra_args: --only-verified

  # ============================================
  # License Compliance
  # ============================================
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install pip-licenses
        run: pip install pip-licenses

      - name: Install backend dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Check Python licenses
        working-directory: ./backend
        run: |
          pip-licenses --format=markdown --output-file=licenses-backend.md
          pip-licenses --fail-on="GPL;AGPL" || echo "⚠️ GPL/AGPL license found"
        continue-on-error: true

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install license-checker
        run: npm install -g license-checker

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Check JavaScript licenses
        working-directory: ./frontend
        run: |
          license-checker --markdown > licenses-frontend.md
          license-checker --failOn "GPL;AGPL" || echo "⚠️ GPL/AGPL license found"
        continue-on-error: true

      - name: Upload license reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: license-reports
          path: |
            backend/licenses-backend.md
            frontend/licenses-frontend.md
          retention-days: 90

  # ============================================
  # Security Summary
  # ============================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [dependency-scan-backend, dependency-scan-frontend, dependency-scan-collab, codeql-analysis, secret-scan]
    if: always()

    steps:
      - name: Security scan summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Dependencies | ${{ needs.dependency-scan-backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Dependencies | ${{ needs.dependency-scan-frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Collaboration Dependencies | ${{ needs.dependency-scan-collab.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{ needs.codeql-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
