# Continuous Integration Workflow
# Runs tests, linting, and type checking on every push and pull request

name: CI - Tests & Quality

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'collab-server/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'collab-server/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_call:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # ============================================
  # Backend Tests & Quality Checks
  # ============================================
  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migration safety framework
        run: python ../scripts/migration_safety/run_migration_safety.py

      - name: Upload migration safety evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-safety-evidence
          path: |
            docs/migrations/evidence/latest-migration-safety.json
            docs/migrations/evidence/latest-dry-run.sql
          retention-days: 30

  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    needs: migration-safety
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check app/ tests/ --output-format=github

      - name: Run Ruff formatter check
        run: ruff format app/ tests/ --check

      - name: Validate audience error-code lockfile
        run: python ../scripts/api_contracts/check_audience_error_codes.py

      - name: Run MyPy type checking
        run: mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true  # Type errors are warnings for now

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create test directories
        run: mkdir -p data uploads

      - name: Run provider contract verification
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
        run: pytest tests/contracts -v

      - name: Run tenant-isolation attack harness
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
        run: pytest tests/tenant_isolation -v

      - name: Run pytest with coverage
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --junitxml=test-results.xml \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 30

  # ============================================
  # Frontend Tests & Quality Checks
  # ============================================
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint 2>/dev/null || echo "No lint script configured"

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test -- --run

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint, frontend-tests]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # ============================================
  # Collaboration Server Checks
  # ============================================
  collab-quality:
    name: Collaboration Server Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./collab-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: collab-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run lint

      - name: Run collaboration server tests
        run: npm run test

  # ============================================
  # Performance & Load Regression Gates
  # ============================================
  performance-gates:
    name: Performance Regression Gates
    runs-on: ubuntu-latest
    needs: [backend-tests, collab-quality, frontend-lint]
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            collab-server/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install collaboration server dependencies
        working-directory: ./collab-server
        run: npm ci

      - name: Create backend directories
        working-directory: ./backend
        run: mkdir -p data uploads

      - name: Run backend performance gate
        run: |
          python scripts/performance/run_backend_perf_gate.py \
            --junit-file backend/perf-gate-results.xml \
            --report-file backend/perf-gate-report.json

      - name: Seed backend data for collaboration gate
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/perf-gate.db
          COLLAB_SERVER_URL: http://127.0.0.1:8002
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: python seed_data.py

      - name: Start backend server for collaboration gate
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/perf-gate.db
          RATE_LIMIT_ENABLED: "false"
          CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173"]'
          COLLAB_SERVER_URL: http://127.0.0.1:8002
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../perf-backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break || sleep 2; done || exit 1

      - name: Start collaboration server for protocol gate
        working-directory: ./collab-server
        env:
          SECRET_KEY: test-secret-key-for-ci
          BACKEND_URL: http://127.0.0.1:8000
          BACKEND_API_PREFIX: /api/v1
          HOST: 127.0.0.1
          PORT: 8002
          REDIS_URL: ""
        run: |
          npm run build
          npm start > ../collab-perf.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8003/health && break || sleep 2; done || exit 1

      - name: Run protocol-faithful collaboration perf gate
        working-directory: ./frontend
        run: |
          npm run test:collab-perf-gate -- \
            --backend-url http://127.0.0.1:8000 \
            --collab-url ws://127.0.0.1:8002 \
            --users 3 \
            --rounds 3 \
            --report-file collab-perf-report.json

      - name: Upload performance gate evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-gate-evidence
          path: |
            backend/perf-gate-results.xml
            backend/perf-gate-report.json
            frontend/collab-perf-report.json
            perf-backend.log
            collab-perf.log
          retention-days: 30

  # ============================================
  # E2E Tests - Stage 1: Core Tests (Quick feedback)
  # ============================================
  e2e-core:
    name: E2E Core Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (for backend)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create backend directories
        working-directory: ./backend
        run: mkdir -p data uploads

      - name: Seed backend data for E2E
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: python seed_data.py

      - name: Rebuild search index
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          python -c "
          from app.db import SessionLocal
          from app.services.search_index_service import SearchIndexSyncService
          db = SessionLocal()
          SearchIndexSyncService(db).rebuild_index()
          db.commit()
          db.close()
          "

      - name: Start backend server
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          RATE_LIMIT_ENABLED: "false"
          CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173"]'
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done || exit 1

      - name: Start frontend dev server
        run: |
          npm run dev &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break || sleep 2; done || exit 1

      - name: Run Core E2E tests (auth, documents, app)
        env:
          PW_SKIP_WEBSERVER: '1'
          BASE_URL: 'http://localhost:3000'
        run: npx playwright test e2e/app.spec.ts e2e/documents.spec.ts --reporter=github

  # ============================================
  # E2E Tests - Stage 2: Role-Based Tests (Parallel)
  # ============================================
  e2e-roles:
    name: E2E Role Tests (${{ matrix.spec }})
    runs-on: ubuntu-latest
    needs: [e2e-core]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend

    strategy:
      fail-fast: false
      matrix:
        spec:
          - admin.spec.ts
          - manager.spec.ts
          - editor.spec.ts
          - viewer.spec.ts
          - viewer-role.spec.ts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (for backend)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create backend directories
        working-directory: ./backend
        run: mkdir -p data uploads

      - name: Seed backend data for E2E
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: python seed_data.py

      - name: Rebuild search index
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          python -c "
          from app.db import SessionLocal
          from app.services.search_index_service import SearchIndexSyncService
          db = SessionLocal()
          SearchIndexSyncService(db).rebuild_index()
          db.commit()
          db.close()
          "

      - name: Start backend server
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          RATE_LIMIT_ENABLED: "false"
          CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173"]'
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done || exit 1

      - name: Start frontend dev server
        run: |
          npm run dev &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break || sleep 2; done || exit 1

      - name: Run E2E tests - ${{ matrix.spec }}
        env:
          PW_SKIP_WEBSERVER: '1'
          BASE_URL: 'http://localhost:3000'
        run: npx playwright test e2e/${{ matrix.spec }} --reporter=github

  # ============================================
  # E2E Tests - Stage 3: Feature Tests (Parallel)
  # ============================================
  e2e-features:
    name: E2E Feature Tests (${{ matrix.spec }})
    runs-on: ubuntu-latest
    needs: [e2e-core]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend

    strategy:
      fail-fast: false
      matrix:
        spec:
          - workflows.spec.ts
          - permissions.spec.ts
          - customer.spec.ts
          - customer-portal.spec.ts
          - public.spec.ts
          - system-admin.spec.ts
          - accessibility.spec.ts
          - a11y-skip-nav.spec.ts
          - a11y-keyboard.spec.ts
          - a11y-announcements.spec.ts
          - a11y-focus-management.spec.ts
          - a11y-ci-regression.spec.ts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (for backend)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create backend directories
        working-directory: ./backend
        run: mkdir -p data uploads

      - name: Seed backend data for E2E
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: python seed_data.py

      - name: Rebuild search index
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          python -c "
          from app.db import SessionLocal
          from app.services.search_index_service import SearchIndexSyncService
          db = SessionLocal()
          SearchIndexSyncService(db).rebuild_index()
          db.commit()
          db.close()
          "

      - name: Start backend server
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          RATE_LIMIT_ENABLED: "false"
          CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173"]'
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done || exit 1

      - name: Start frontend dev server
        run: |
          npm run dev &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break || sleep 2; done || exit 1

      - name: Run E2E tests - ${{ matrix.spec }}
        env:
          PW_SKIP_WEBSERVER: '1'
          BASE_URL: 'http://localhost:3000'
        run: npx playwright test e2e/${{ matrix.spec }} --reporter=github

  # ============================================
  # Summary Job
  # ============================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [migration-safety, backend-tests, frontend-tests, collab-quality, performance-gates, e2e-core, e2e-roles, e2e-features]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          echo "## 🧪 CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Migration Safety | ${{ needs.migration-safety.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Unit Tests | ${{ needs.frontend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Collab Quality | ${{ needs.collab-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Gates | ${{ needs.performance-gates.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Core | ${{ needs.e2e-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Roles | ${{ needs.e2e-roles.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Features | ${{ needs.e2e-features.result }} |" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.migration-safety.result }}" != "success" ]]; then
            echo "Migration safety checks failed"
            exit 1
          fi
          if [[ "${{ needs.backend-tests.result }}" != "success" ]]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-tests.result }}" != "success" ]]; then
            echo "Frontend unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.collab-quality.result }}" != "success" ]]; then
            echo "❌ Collaboration server checks failed"
            exit 1
          fi
          if [[ "${{ needs.performance-gates.result }}" != "success" ]]; then
            echo "Performance regression gates failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-core.result }}" != "success" ]]; then
            echo "❌ E2E core tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-roles.result }}" != "success" ]]; then
            echo "❌ E2E role tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-features.result }}" != "success" ]]; then
            echo "❌ E2E feature tests failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
