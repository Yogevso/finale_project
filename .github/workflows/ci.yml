# Continuous Integration Workflow
# Runs tests, linting, and type checking on every push and pull request

name: CI - Tests & Quality

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'collab-server/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'collab-server/**'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      test_profile:
        description: "Test profile to run"
        required: true
        default: critical
        type: choice
        options:
          - critical
          - full
      debug_mode:
        description: "Upload extra debug artifacts and print runtime logs on failures"
        required: false
        default: false
        type: boolean
  workflow_call:

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  ci-mode:
    name: Resolve CI Mode
    runs-on: ubuntu-latest
    outputs:
      run_extended_suite: ${{ steps.resolve.outputs.run_extended_suite }}
      debug_mode: ${{ steps.resolve.outputs.debug_mode }}

    steps:
      - name: Resolve runtime mode
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          run_extended_suite="false"
          debug_mode="false"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_call" ]]; then
            run_extended_suite="true"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            test_profile="$(jq -r '.inputs.test_profile // "critical"' "$GITHUB_EVENT_PATH")"
            debug_input="$(jq -r '.inputs.debug_mode // "false"' "$GITHUB_EVENT_PATH")"

            if [[ "${test_profile}" == "full" ]]; then
              run_extended_suite="true"
            fi

            if [[ "${debug_input}" == "true" ]]; then
              debug_mode="true"
            fi
          fi

          echo "run_extended_suite=${run_extended_suite}" >> "$GITHUB_OUTPUT"
          echo "debug_mode=${debug_mode}" >> "$GITHUB_OUTPUT"

  # ============================================
  # Backend Tests & Quality Checks
  # ============================================
  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migration safety framework
        run: python ../scripts/migration_safety/run_migration_safety.py

      - name: Upload migration safety evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-safety-evidence
          path: |
            docs/migrations/evidence/latest-migration-safety.json
            docs/migrations/evidence/latest-dry-run.sql
          retention-days: 30

  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    needs: [ci-mode, migration-safety]
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Ruff linter
        run: ruff check app/ tests/ --output-format=github

      - name: Run Ruff formatter check
        run: ruff format app/ tests/ --check

      - name: Validate audience error-code lockfile
        run: python ../scripts/api_contracts/check_audience_error_codes.py

      - name: Run MyPy type checking
        run: mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true # Type errors are warnings for now

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [ci-mode, backend-lint]
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create test directories
        run: mkdir -p data uploads

      - name: Run pytest with coverage
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --junitxml=test-results.xml \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/test-results.xml
          retention-days: 30

  # ============================================
  # Frontend Tests & Quality Checks
  # ============================================
  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: [ci-mode, frontend-lint]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend unit tests
        run: npm run test -- --run

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [ci-mode, frontend-lint, frontend-tests]
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: |
          npm run generate:api-contracts:check
          npx vite build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          retention-days: 7

  # ============================================
  # Collaboration Server Checks
  # ============================================
  collab-quality:
    name: Collaboration Server Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./collab-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: collab-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run lint

      - name: Run collaboration server tests
        run: npm run test

  # ============================================
  # Performance & Load Regression Gates
  # ============================================
  performance-gates:
    name: Performance Regression Gates
    runs-on: ubuntu-latest
    if: needs.ci-mode.outputs.run_extended_suite == 'true'
    needs: [ci-mode, backend-tests, collab-quality, frontend-lint]
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            collab-server/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install collaboration server dependencies
        working-directory: ./collab-server
        run: npm ci

      - name: Create backend directories
        working-directory: ./backend
        run: mkdir -p data uploads

      - name: Run backend performance gate
        run: |
          python scripts/performance/run_backend_perf_gate.py \
            --junit-file backend/perf-gate-results.xml \
            --report-file backend/perf-gate-report.json

      - name: Seed backend data for collaboration gate
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/perf-gate.db
          COLLAB_SERVER_URL: http://127.0.0.1:8002
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: python seed_data.py

      - name: Start backend server for collaboration gate
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/perf-gate.db
          RATE_LIMIT_ENABLED: "false"
          CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173"]'
          COLLAB_SERVER_URL: http://127.0.0.1:8002
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../perf-backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health && break || sleep 2; done || exit 1

      - name: Start collaboration server for protocol gate
        working-directory: ./collab-server
        env:
          SECRET_KEY: test-secret-key-for-ci
          BACKEND_URL: http://127.0.0.1:8000
          BACKEND_API_PREFIX: /api/v1
          HOST: 127.0.0.1
          PORT: 8002
          REDIS_URL: ""
        run: |
          npm run build
          npm start > ../collab-perf.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8003/health && break || sleep 2; done || exit 1

      - name: Run protocol-faithful collaboration perf gate
        working-directory: ./frontend
        run: |
          npm run test:collab-perf-gate -- \
            --backend-url http://127.0.0.1:8000 \
            --collab-url ws://127.0.0.1:8002 \
            --users 3 \
            --rounds 3 \
            --report-file collab-perf-report.json

      - name: Upload performance gate evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-gate-evidence
          path: |
            backend/perf-gate-results.xml
            backend/perf-gate-report.json
            frontend/collab-perf-report.json
            perf-backend.log
            collab-perf.log
          retention-days: 30

  # ============================================
  # E2E Tests - Stage 1: Core Tests (Quick feedback)
  # ============================================
  e2e-core:
    name: E2E Core Tests
    runs-on: ubuntu-latest
    if: needs.ci-mode.outputs.run_extended_suite == 'true'
    needs: [ci-mode, backend-tests, frontend-build]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (for backend)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create backend directories
        working-directory: ./backend
        run: mkdir -p data uploads

      - name: Seed backend data for E2E
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: python seed_data.py

      - name: Rebuild search index
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          python -c "
          from app.db import SessionLocal
          from app.services.search_index_service import SearchIndexSyncService
          db = SessionLocal()
          SearchIndexSyncService(db).rebuild_index()
          db.commit()
          db.close()
          "

      - name: Start backend server
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          RATE_LIMIT_ENABLED: "false"
          CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173"]'
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../e2e-backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done || exit 1

      - name: Start frontend dev server
        run: |
          npm run dev > ../e2e-frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break || sleep 2; done || exit 1

      - name: Run Core E2E tests (auth, documents, app)
        env:
          PW_SKIP_WEBSERVER: "1"
          BASE_URL: "http://localhost:3000"
        run: npx playwright test e2e/app.spec.ts e2e/documents.spec.ts e2e/permissions.spec.ts --reporter=github,line

      - name: Debug E2E runtime logs (core)
        if: failure() && needs.ci-mode.outputs.debug_mode == 'true'
        run: |
          echo "===== backend (tail) ====="
          tail -n 300 ../e2e-backend.log || true
          echo "===== frontend (tail) ====="
          tail -n 300 ../e2e-frontend.log || true

      - name: Upload E2E artifacts (core)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-core-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            e2e-backend.log
            e2e-frontend.log
          if-no-files-found: ignore
          retention-days: 14

  # ============================================
  # E2E Tests - Stage 2: Role-Based Tests (Parallel)
  # ============================================
  e2e-roles:
    name: E2E Role Tests (${{ matrix.spec }})
    runs-on: ubuntu-latest
    if: needs.ci-mode.outputs.run_extended_suite == 'true'
    needs: [ci-mode, e2e-core]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend

    strategy:
      fail-fast: false
      matrix:
        spec:
          - admin.spec.ts
          - manager.spec.ts
          - editor.spec.ts
          - viewer.spec.ts
          - viewer-role.spec.ts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (for backend)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create backend directories
        working-directory: ./backend
        run: mkdir -p data uploads

      - name: Seed backend data for E2E
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: python seed_data.py

      - name: Rebuild search index
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          python -c "
          from app.db import SessionLocal
          from app.services.search_index_service import SearchIndexSyncService
          db = SessionLocal()
          SearchIndexSyncService(db).rebuild_index()
          db.commit()
          db.close()
          "

      - name: Start backend server
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          RATE_LIMIT_ENABLED: "false"
          CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173"]'
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../e2e-backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done || exit 1

      - name: Start frontend dev server
        run: |
          npm run dev > ../e2e-frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break || sleep 2; done || exit 1

      - name: Run E2E tests - ${{ matrix.spec }}
        env:
          PW_SKIP_WEBSERVER: "1"
          BASE_URL: "http://localhost:3000"
        run: npx playwright test e2e/${{ matrix.spec }} --reporter=github,line

      - name: Debug E2E runtime logs (roles)
        if: failure() && needs.ci-mode.outputs.debug_mode == 'true'
        run: |
          echo "===== backend (tail) ====="
          tail -n 300 ../e2e-backend.log || true
          echo "===== frontend (tail) ====="
          tail -n 300 ../e2e-frontend.log || true

      - name: Upload E2E artifacts (roles)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-roles-${{ matrix.spec }}-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            e2e-backend.log
            e2e-frontend.log
          if-no-files-found: ignore
          retention-days: 14

  # ============================================
  # E2E Tests - Stage 3: Feature Tests (Parallel)
  # ============================================
  e2e-features:
    name: E2E Feature Tests (${{ matrix.spec }})
    runs-on: ubuntu-latest
    if: needs.ci-mode.outputs.run_extended_suite == 'true'
    needs: [ci-mode, e2e-core]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./frontend

    strategy:
      fail-fast: false
      matrix:
        spec:
          - workflows.spec.ts
          - permissions.spec.ts
          - customer.spec.ts
          - customer-portal.spec.ts
          - public.spec.ts
          - system-admin.spec.ts
          - accessibility.spec.ts
          - a11y-skip-nav.spec.ts
          - a11y-keyboard.spec.ts
          - a11y-announcements.spec.ts
          - a11y-focus-management.spec.ts
          - a11y-ci-regression.spec.ts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python (for backend)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Create backend directories
        working-directory: ./backend
        run: mkdir -p data uploads

      - name: Seed backend data for E2E
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: python seed_data.py

      - name: Rebuild search index
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          python -c "
          from app.db import SessionLocal
          from app.services.search_index_service import SearchIndexSyncService
          db = SessionLocal()
          SearchIndexSyncService(db).rebuild_index()
          db.commit()
          db.close()
          "

      - name: Start backend server
        working-directory: ./backend
        env:
          APP_ENV: testing
          SECRET_KEY: test-secret-key-for-ci
          DATABASE_URL: sqlite:///./data/test.db
          RATE_LIMIT_ENABLED: "false"
          CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173"]'
          SEARCH_BACKEND_MODE: sqlite_fts5
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > ../e2e-backend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break || sleep 2; done || exit 1

      - name: Start frontend dev server
        run: |
          npm run dev > ../e2e-frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000 && break || sleep 2; done || exit 1

      - name: Run E2E tests - ${{ matrix.spec }}
        env:
          PW_SKIP_WEBSERVER: "1"
          BASE_URL: "http://localhost:3000"
        run: npx playwright test e2e/${{ matrix.spec }} --reporter=github,line

      - name: Debug E2E runtime logs (features)
        if: failure() && needs.ci-mode.outputs.debug_mode == 'true'
        run: |
          echo "===== backend (tail) ====="
          tail -n 300 ../e2e-backend.log || true
          echo "===== frontend (tail) ====="
          tail -n 300 ../e2e-frontend.log || true

      - name: Upload E2E artifacts (features)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-features-${{ matrix.spec }}-artifacts
          path: |
            frontend/playwright-report
            frontend/test-results
            e2e-backend.log
            e2e-frontend.log
          if-no-files-found: ignore
          retention-days: 14

  # ============================================
  # Summary Job
  # ============================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [
        ci-mode,
        migration-safety,
        backend-tests,
        frontend-tests,
        collab-quality,
        performance-gates,
        e2e-core,
        e2e-roles,
        e2e-features,
      ]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          echo "## 🧪 CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Extended suite: ${{ needs.ci-mode.outputs.run_extended_suite }}" >> $GITHUB_STEP_SUMMARY
          echo "- Debug mode: ${{ needs.ci-mode.outputs.debug_mode }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Migration Safety | ${{ needs.migration-safety.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend Tests | ${{ needs.backend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Unit Tests | ${{ needs.frontend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Collab Quality | ${{ needs.collab-quality.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Gates | ${{ needs.performance-gates.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Core | ${{ needs.e2e-core.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Roles | ${{ needs.e2e-roles.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Features | ${{ needs.e2e-features.result }} |" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.migration-safety.result }}" != "success" ]]; then
            echo "Migration safety checks failed"
            exit 1
          fi
          if [[ "${{ needs.backend-tests.result }}" != "success" ]]; then
            echo "❌ Backend tests failed"
            exit 1
          fi
          if [[ "${{ needs.frontend-tests.result }}" != "success" ]]; then
            echo "Frontend unit tests failed"
            exit 1
          fi
          if [[ "${{ needs.collab-quality.result }}" != "success" ]]; then
            echo "❌ Collaboration server checks failed"
            exit 1
          fi
          if [[ "${{ needs.performance-gates.result }}" != "success" && "${{ needs.performance-gates.result }}" != "skipped" ]]; then
            echo "Performance regression gates failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-core.result }}" != "success" && "${{ needs.e2e-core.result }}" != "skipped" ]]; then
            echo "❌ E2E core tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-roles.result }}" != "success" && "${{ needs.e2e-roles.result }}" != "skipped" ]]; then
            echo "❌ E2E role tests failed"
            exit 1
          fi
          if [[ "${{ needs.e2e-features.result }}" != "success" && "${{ needs.e2e-features.result }}" != "skipped" ]]; then
            echo "❌ E2E feature tests failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"

  failure-debug-summary:
    name: Failure Debug Summary
    runs-on: ubuntu-latest
    needs:
      [
        ci-mode,
        migration-safety,
        backend-tests,
        frontend-tests,
        collab-quality,
        performance-gates,
        e2e-core,
        e2e-roles,
        e2e-features,
      ]
    if: failure() && needs.ci-mode.outputs.debug_mode == 'true'

    steps:
      - name: Print failing jobs
        run: |
          echo "Debug summary (requested):"
          echo "- migration-safety: ${{ needs.migration-safety.result }}"
          echo "- backend-tests: ${{ needs.backend-tests.result }}"
          echo "- frontend-tests: ${{ needs.frontend-tests.result }}"
          echo "- collab-quality: ${{ needs.collab-quality.result }}"
          echo "- performance-gates: ${{ needs.performance-gates.result }}"
          echo "- e2e-core: ${{ needs.e2e-core.result }}"
          echo "- e2e-roles: ${{ needs.e2e-roles.result }}"
          echo "- e2e-features: ${{ needs.e2e-features.result }}"
