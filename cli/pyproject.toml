[project]
name = "portal-cli"
version = "1.0.0"
description = "CLI for the Documentation Platform AI Assistant"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.25",
]

[project.scripts]
portal-cli = "assistant_cli.main:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
