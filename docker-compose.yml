services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: v2-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend-data:/app/data
      - ./data/chromadb:/app/data/chromadb
    environment:
      - APP_ENV=development
      - SECRET_KEY=docker-dev-secret-key-change-in-prod
      - DEBUG=true
      - SQL_ECHO=false
      - DATABASE_URL=sqlite:///./data/portal.db
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:80"]
      - OLLAMA_BASE_URL=http://ollama:11434
      - ASSISTANT_MODEL=llama3.1:8b
      - ASSISTANT_MAX_TOKENS=2048
      - ASSISTANT_TEMPERATURE=0.7
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 5
      start_period: 30s
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: v2-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api/v1
      - VITE_API_PROXY_TARGET=http://backend:8000
      - VITE_COLLAB_SERVER_URL=ws://localhost:8002
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Real-time Collaboration Server (Hocuspocus)
  collab-server:
    build:
      context: ./collab-server
      dockerfile: Dockerfile
    container_name: v2-collab-server
    ports:
      - "8002:8002"
      - "8003:8003"
    environment:
      - PORT=8002
      - HOST=0.0.0.0
      - JWT_SECRET=docker-dev-secret-key-change-in-prod
      - BACKEND_URL=http://backend:8000
      - LOG_LEVEL=debug
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8003/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Self-hosted LLM inference (AI Assistant)
  ollama:
    image: ollama/ollama:latest
    container_name: v2-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  backend-data:
  ollama-data:
